monitors:
  - name: "Mizuchi Labs"
    url: "https://mizuchi.dev"
    group: "Websites"
  - name: "Google"
    url: "https://google.com"
    group: "Websites"
  - name: "GitHub"
    url: "https://github.com"
    group: "Websites"
    keyword: "GitHub"
  - name: "Certificate"
    url: "ssl://mizuchi.dev"
    group: "Infrastructure"
    check_interval: 3600
  - name: "Cloudflare DNS"
    url: "dns://mizuchi.dev?server=1.1.1.1"
    group: "Infrastructure"
  - name: "Router"
    url: "ping://1.1.1.1"
    group: "Infrastructure"
    check_interval: 30
  - name: "Postgres"
    url: "tcp://localhost:5432"
    group: "Infrastructure"
    check_interval: 30
    retries: 2
  - name: "Nightly backup"
    url: "push://change-me-to-something-random"
    group: "Jobs"
    check_interval: 86400

# Every notification is POSTed to each webhook. Without a body the event is
